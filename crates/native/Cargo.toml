[package]
name = "bubble-ffi"
version = "0.1.0"
edition = "2021"
description = "QuickJS script thread and C ABI for native Bubble Shell hosts"
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
bubble-core = { path = "../core" }
rquickjs = { version = "0.14", features = ["bindgen", "loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
