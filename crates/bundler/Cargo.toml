[package]
name = "bubble-bundler"
version = "0.1.0"
edition = "2021"
description = "Rolldown-based release bundler for Bubble fixtures"
license = "MIT"

[dependencies]
anyhow = "1"
arcstr = "1"
bubble-compiler = { path = "../compiler" }
rolldown = "=1.3.2"
rolldown_common = "=1.3.2"
rolldown_plugin = "=1.3.2"
rolldown_sourcemap = "=1.3.2"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
