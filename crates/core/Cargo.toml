[package]
name = "bubble-core"
version = "0.1.0"
edition = "2021"
description = "Bubble Shell retained tree, layout, op protocol, and bundle checks"
license = "MIT"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }
