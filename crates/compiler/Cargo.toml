[package]
name = "bubble-compiler"
version = "0.1.0"
edition = "2021"
description = "Bubble module compiler: strips TypeScript and lowers JSX to bubble:rt calls"
license = "MIT"

[dependencies]
oxc = { version = "=0.158.0", default-features = false, features = [
    "ast_visit",
    "codegen",
    "semantic",
    "transformer",
] }
