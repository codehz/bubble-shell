[package]
name = "bubble-cli"
version = "0.1.0"
edition = "2021"
description = "Build and serve Bubble fixture bundles"
license = "MIT"

[lib]
name = "bubble_cli"
path = "src/lib.rs"

[[bin]]
name = "bubble"
path = "src/main.rs"

[dev-dependencies]
sha2 = "0.10"

[dependencies]
bubble-bundler = { path = "../bundler" }
serde_json = "1"
sha1 = "0.10"
