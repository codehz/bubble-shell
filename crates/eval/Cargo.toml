[package]
name = "bubble-eval"
version = "0.1.0"
edition = "2021"
description = "Headless Bubble Shell scenarios and milestone reports"
license = "MIT"

[dependencies]
bubble-ffi = { path = "../native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "bubble-eval"
path = "src/main.rs"
